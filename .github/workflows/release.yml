name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 版本号只在这里注入一次：只有「push tag 触发」时把 tag 号（去 v）写进
# CHAOS_VERSION_TAG；workflow_dispatch（即使选了 tag ref）、PR、日常 CI 都不设，
# scripts/version.sh 读不到就自动生成「年月日-commit hash」。
env:
  CHAOS_VERSION_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  test:
    name: 格式 / 静态检查 / 测试 / 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 校验 workflow 结构
        run: |
          go run ./tools/checkworkflows \
            --expect-jobs lint,test,race,linux-e2e,macos-build,windows-build,settings-windows \
            .github/workflows/ci.yml
          go run ./tools/checkworkflows \
            --expect-jobs test,package-macos,package-linux,package-windows,release \
            .github/workflows/release.yml

      - name: gofmt 检查（不应有输出）
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # 注：renderer 包已于 2026-10-27 删除，Go 测试不再需要 CJK 字体；
      # 原「安装 CJK 字体」步骤随 2026-11-08 审计清理移除（GTK 无头冒烟在 ci.yml
      # 的 linux-e2e job 内自行安装）。
      - name: 安装 Slint 构建依赖 (fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: 运行单元测试
        run: make test

      # 核心层行为测试：用真实 chaosetd 的 Unix socket 测试台驱动 core.cpp 的
      # 协议与会话逻辑。测试在 Linux CI 常跑，毫秒级快速发现协议漂移。
      - name: 核心层行为测试（真实 daemon + Unix socket）
        run: |
          set -e
          g++ -std=c++17 -O2 -Wall -Wextra -Ishims/windows/src -Ishims/common/ipc \
              shims/windows/tests/core_test.cpp shims/common/ipc/core.cpp \
              -o /tmp/core_test
          make build
          SOCKDIR=$(mktemp -d /tmp/chaoset.XXXXXX)
          SOCK="$SOCKDIR/core.sock"
          ./bin/chaosetd -socket "$SOCK" \
              -dict data/dict_common.tsv -userdict "" > /tmp/win-daemon.log 2>&1 &
          DPID=$!
          trap 'kill -TERM $DPID 2>/dev/null || true; rm -rf "$SOCKDIR"' EXIT
          for i in $(seq 1 50); do
            if [ -S "$SOCK" ]; then break; fi
            sleep 0.2
          done
          /tmp/core_test "$SOCK"

      - name: 运行代码静态检查
        run: make vet

  package-macos:
    name: 打包 macOS (ChaosetIME.app + ChaosetSetup.app)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      # 与日常 CI（ci.yml 的 macos-build job）走同一条打包链：Makefile 的
      # package-macos 负责 universal 自检（主壳/安装器/app 内置工具）、app 版本号
      # 一致性、app 资源清单与 zip 生成。此前 release 手写了一份更弱的复制品
      # （只 lipo 两个主二进制），发版包与日常 CI 验证过的包可能不一致
      # （2026-11-08 审计 P1-4）。
      - name: 编译 Slint macOS 设置中心（universal）
        run: make build-settings-universal

      - name: 构建 Rust CLI 与 macOS 安装包（make package-macos）
        run: |
          make build
          make package-macos
          test -f shims/macos/build/ChaosetIME.app/Contents/Resources/dict_common.bin \
            || { echo "macOS 包缺少二进制词库 dict_common.bin"; exit 1; }
          SETTINGS_APP="shims/macos/build/ChaosetIME.app/Contents/Resources/ChaosetSettings.app"
          test -x "$SETTINGS_APP/Contents/MacOS/chaoset-settings" \
            || { echo "macOS 包缺少 ChaosetSettings.app（设置中心 app bundle）"; exit 1; }
          test -f "$SETTINGS_APP/Contents/Info.plist" \
            || { echo "ChaosetSettings.app 缺少 Info.plist"; exit 1; }
          test -f "$SETTINGS_APP/Contents/Resources/ChaosetSettings.icns" \
            || { echo "ChaosetSettings.app 缺少品牌图标"; exit 1; }

      # 等价性回归（D 段 keycap/图标契约、E 段系统渲染尺寸、B 段导入链路）：
      # 需要真实 macOS 与已构建的 app，release 里显式再跑一次。
      - name: 等价性回归（keycap/图标/导入链路）
        run: |
          chmod +x shims/macos/tests/equivalence.sh
          ./shims/macos/tests/equivalence.sh

      # 双端视觉一致性（Windows 原生端 vs macOS 原生端）需要 swiftc，只能在
      # macOS runner 上跑，所以在 package-macos job 里单独成步，失败原因比
      # 埋在 equivalence.sh 的 F 段里更醒目。
      - name: 双端视觉一致性（Windows vs macOS 原生端）
        run: ./shims/macos/tests/visual-parity.sh

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: chaoset-macos
          path: |
            dist/chaoset-macos.zip
          retention-days: 14

  package-linux:
    name: 打包 Linux (IBus Engine + 资源)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: 安装 ibus 与 zstd 测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ibus zstd build-essential pkg-config libibus-1.0-dev file \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxkbcommon-x11-0 xvfb

      - name: 编译 Slint Linux 设置中心
        run: make build-settings

      - name: 编译与打包
        run: |
          make build
          make package-linux

      # 冒烟校验：测 deb 安装、tar.gz 脚本安装、Arch Linux 格式包完整性
      - name: 冒烟校验（DEB 安装、tar.gz 安装、Arch 包校验）
        run: |
          test -f dist/chaoset_amd64.deb || { echo "缺少 chaoset_amd64.deb"; exit 1; }
          sudo dpkg -i dist/chaoset_amd64.deb
          test -x /usr/bin/chaoset-engine || { echo "deb 未安装 /usr/bin/chaoset-engine"; exit 1; }
          # 设置窗口脚本是 component XML <setup> 的入口，缺了会导致 ibus-setup
          # 「首选项」点了没反应（2026-10-30 审计 B-P1-6）；deb/tar.gz/Arch 三个包都要有。
          test -x /usr/share/chaoset/chaoset-setup || { echo "deb 缺少设置入口脚本"; exit 1; }
          test -x /usr/bin/chaoset-settings || { echo "deb 缺少 Slint 统一设置中心"; exit 1; }
          test -f /usr/share/chaoset/dict.bin || { echo "deb 缺少二进制词库 dict.bin"; exit 1; }
          test -f /usr/share/icons/hicolor/16x16/apps/chaoset.png || { echo "deb 缺少 16x16 应用图标"; exit 1; }
          timeout 5 /usr/bin/chaoset-engine --ibus > /tmp/deb-engine.log 2>&1 || true
          grep -q '加载词库: /usr/share/chaoset/dict.tsv' /tmp/deb-engine.log \
            || { echo "DEB 引擎未加载词库，日志："; cat /tmp/deb-engine.log; exit 1; }
          echo "DEB 包冒烟测试通过"
          sudo dpkg -r chaoset-ime

          mkdir -p /tmp/smoke && tar -xzf dist/chaoset-linux-x86_64.tar.gz -C /tmp/smoke
          cd /tmp/smoke/chaoset-linux-x86_64
          sudo ./install.sh
          # 引擎按 ibus 的方式（无 cwd 依赖）拉起，必须能找到词库
          cd / && timeout 5 /usr/bin/chaoset-engine --ibus > /tmp/engine.log 2>&1 || true
          grep -q '加载词库: /usr/share/chaoset/dict.tsv' /tmp/engine.log \
            || { echo "引擎未加载词库，日志："; cat /tmp/engine.log; exit 1; }
          grep -q '打开词库.*失败' /tmp/engine.log && { echo "引擎找不到词库"; cat /tmp/engine.log; exit 1; } || true
          test -x /usr/share/chaoset/chaoset-setup || { echo "tar.gz 安装后缺少设置入口脚本"; exit 1; }
          test -x /usr/bin/chaoset-settings || { echo "tar.gz 安装后缺少 Slint 统一设置中心"; exit 1; }
          test -f /usr/share/chaoset/dict.bin || { echo "tar.gz 安装后缺少二进制词库 dict.bin"; exit 1; }
          test -f /usr/share/icons/hicolor/16x16/apps/chaoset.png || { echo "tar.gz 安装后缺少 16x16 应用图标"; exit 1; }
          echo "tar.gz 冒烟校验通过"

          cd "$GITHUB_WORKSPACE"
          test -f dist/chaoset-ime-x86_64.pkg.tar.zst || { echo "缺少 chaoset-ime-x86_64.pkg.tar.zst"; exit 1; }
          tar -tf dist/chaoset-ime-x86_64.pkg.tar.zst | grep -q '.PKGINFO' || { echo "Arch 包缺少 .PKGINFO"; exit 1; }
          tar -tf dist/chaoset-ime-x86_64.pkg.tar.zst | grep -q 'usr/share/chaoset/chaoset-setup'               || { echo "Arch 包缺少设置入口脚本（ibus-setup 首选项会失效）"; exit 1; }
          tar -tf dist/chaoset-ime-x86_64.pkg.tar.zst | grep -q 'usr/bin/chaoset-settings'                   || { echo "Arch 包缺少 Slint 统一设置中心"; exit 1; }
          tar -tf dist/chaoset-ime-x86_64.pkg.tar.zst | grep -q 'usr/share/chaoset/dict.bin'                || { echo "Arch 包缺少二进制词库 dict.bin"; exit 1; }
          tar -tf dist/chaoset-ime-x86_64.pkg.tar.zst | grep -q 'usr/share/icons/hicolor/16x16/apps/chaoset.png' || { echo "Arch 包缺少 16x16 应用图标"; exit 1; }
          echo "Arch Linux 包格式自检通过"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: chaoset-linux-x86_64
          path: |
            dist/chaoset-linux-x86_64.tar.gz
            dist/chaoset_amd64.deb
            dist/chaoset-ime-x86_64.pkg.tar.zst
          retention-days: 14

  package-windows:
    name: 打包 Windows (TSF DLL + 命名管道 Daemon)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: 配置 MSVC (x64) 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Make 与 NSIS 打包工具
        run: |
          choco install make nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          echo "C:\Program Files\NSIS" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Windows 设置中心编译 (chaoset-settings.exe)
        run: make build-settings-windows

      - name: Windows 壳原生编译与打包（MSVC + NSIS）
        shell: bash
        run: |
          chmod +x shims/windows/package_msvc.sh
          ./shims/windows/package_msvc.sh

      # 版本信息 / app 信息校验：安装器 EXE 与包内每个 PE 二进制（含 chaoset-ui.exe 与 ChaosetRunUi 导出）
      # 都必须带 VS_VERSION_INFO，中文资源不得乱码（由 scripts/check_windows_version_info.py 统一断言）。
      - name: 校验版本信息 / app 信息
        shell: bash
        run: |
          python3 scripts/check_windows_version_info.py || python scripts/check_windows_version_info.py

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: chaoset-windows-x64
          path: |
            dist/chaoset-windows-x64.zip
            dist/ChaosetSetup.exe
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: [package-macos, package-linux, package-windows]
    runs-on: ubuntu-24.04
    # 只在 push tag 时创建 Release（2026-11-08 审计 P1-1）：workflow_dispatch
    # 即使选了 tag ref 也不会注入 CHAOS_VERSION_TAG，三端产物是「日期-hash」
    # 构建；允许 dispatch 发 Release 会把无法追溯的包发布成该 tag 的正式版本。
    # dispatch 仍可用于只产出 artifact 的预演（三个 package job 不受影响）。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v7
        with:
          name: chaoset-macos
          path: dist

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v7
        with:
          name: chaoset-linux-x86_64
          path: dist

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v7
        with:
          name: chaoset-windows-x64
          path: dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ChaosetSetup.exe
            dist/chaoset_amd64.deb
            dist/chaoset-ime-x86_64.pkg.tar.zst
            dist/chaoset-windows-x64.zip
            dist/chaoset-macos.zip
            dist/chaoset-linux-x86_64.tar.gz
          generate_release_notes: true
