name: CI

# 设计原则：把验证拆到多个并行 runner，本地只跑「改动的直接相关项」。
#
# 用户诉求（2026-10-26）：测试尽量交给 GitHub Actions，本地不跑重活，避免
# 跑测试时拖慢正常用电脑。因此 CI 覆盖了所有耗时的端到端验证：
#   - Go 单测 + race（race 本机要跑 45s+，是最重的一项）
#   - Linux 容器内 ibus 端到端（需要 docker + dbus，本机跑占资源）
#   - Windows 壳交叉编译 + 核心层行为测试 + NSIS 安装包（windows-build job；
#     2026-10-31 从「只在 release.yml 打 tag 时编译」提到日常 CI）
#   - macOS 构建 + 等价性 + 双端视觉一致性（见 release.yml 的 package-macos）
#
# 各 job 相互独立并行，单次提交约 3-5 分钟出全部结论。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧的仍在跑的流水。
#
# 但**必须按 job 分开配**：2026-10-26 实测踩坑——顶层无条件
# `cancel-in-progress: true` 时，连续两次 push 会把上一次的 macos-build 标成
# `cancelled` 并给出注解「Canceling since a higher priority waiting request
# for ci-refs/heads/main exists」。macOS runner 有容量限制、排队动辄 10 分钟，
# 而普通提交间隔远小于这个时间 → **日常提交的 macOS 验证永远跑不完**，
# 等于白配。
#
# 现在：快的 job 照旧取消（省额度、反馈快），macOS job 不配 concurrency
# （让它排完、跑完；一次排队比反复取消更省时间）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 基础：格式 / 静态检查 / 构建（最快，失败就早停）────────────
  lint:
    name: 格式 / 静态检查 / 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # workflow 结构校验：2026-10-25 有过一次文本替换误删 job 声明，导致
      # YAML 仍合法但 GitHub 判 workflow file issue、CI 全线不跑的教训。
      - name: 校验 workflow 结构
        run: |
          go run ./tools/checkworkflows \
            --expect-jobs lint,test,race,linux-e2e,macos-build,windows-build \
            .github/workflows/ci.yml
          go run ./tools/checkworkflows \
            --expect-jobs test,package-macos,package-linux,package-windows,release \
            .github/workflows/release.yml

      - name: gofmt 检查（不应有输出）
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: 静态检查（go vet + workflow + 版本单一真源）
        run: make vet

      - name: 核心构建检查
        run: make build

      # 度量工具带 //go:build ignore，不在 ./... 里，单独编译防止烂掉。
      - name: 检查度量工具可编译
        run: go build -o /dev/null tools/render_metrics.go

  # ── 2. Go 单测 ────────────────────────────────────────────────────
  test:
    name: 单元测试
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 注：renderer 包已于 2026-10-27 删除，不再需要 CJK 字体做候选窗 PNG 渲染断言
      #（2026-10-30 审计清理）。如后续新增需要字体的测试，再在此安装。
      - name: 运行单元测试
        run: make test

  # ── 3. 数据竞争检测（本机最重的一项，完全交给 CI）─────────────────
  race:
    name: 数据竞争检测
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: race detector
        run: make race

  # ── 4. Linux 容器内 ibus 端到端（本机跑会占大量资源）──────────────
  linux-e2e:
    name: Linux 容器 E2E（ibus）
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 这套 DBus 端到端此前**只在人工容器里跑过**，CI 从未执行
      # （2026-10-26 审查指出）。现在放进 CI。
      #
      # 用 test-ci.sh（原生版）而不是 test.sh：test.sh 假设本地已用
      # setup-container.sh 起了 docker 容器并通过 docker exec 操作，而
      # GitHub runner 本身就是一次性 VM，再套 docker 要多花 1-3 分钟拉镜像。
      - name: 安装 ibus 与 dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ibus dbus dbus-x11 gir1.2-ibus-1.0 python3-gi

      - name: ibus 引擎端到端（组词/上屏/多实例隔离/中英切换/翻页）
        run: |
          chmod +x shims/linux/test-ci.sh
          ./shims/linux/test-ci.sh

      # 设置窗脚本无法在无桌面 CI 里真正打开 GTK 窗口，但至少要保证：
      #   ① 三个脚本语法正确（py_compile，不 import gi，可在无头环境跑）；
      #   ② 学习数据 / 词库导入编排逻辑正确（依赖注入单测，不需要 GTK/ibus/真实
      #      引擎；engine 包零改动的边界也由它们覆盖——只调用随包 CLI 本地模式）。
      - name: 设置窗脚本语法检查 + 学习数据/词库导入助手单测（无 GTK）
        run: |
          python3 -m py_compile shims/linux/setup/chaoset-setup.py shims/linux/setup/userdict_ctl.py shims/linux/setup/dictimport_ctl.py
          python3 -m unittest discover -s shims/linux/setup -p 'test_*.py'

      # 打包回归：release.yml 的安装包冒烟只在打 tag 时跑，日常改动可能悄悄
      # 漏装设置窗模块（2026-10-31 新加 dictimport_ctl.py 就是这类风险）。
      # 这里在 PR/日常提交上构建 tar.gz（以及可用的 deb）并断言三个设置窗
      # 脚本都在包里。
      - name: Linux 安装包自检（设置窗模块必须随包）
        run: |
          make package-linux
          tar -tzf dist/chaoset-linux-x86_64.tar.gz > /tmp/pkg-list.txt
          for f in setup/chaoset-setup.py setup/userdict_ctl.py setup/dictimport_ctl.py data/dict.tsv; do
            grep -q "$f" /tmp/pkg-list.txt || { echo "tar.gz 缺少 $f"; exit 1; }
          done
          if command -v dpkg-deb >/dev/null 2>&1 && [ -f dist/chaoset_amd64.deb ]; then
            dpkg-deb -c dist/chaoset_amd64.deb | grep -q 'usr/share/chaoset/dictimport_ctl.py' \
              || { echo "deb 缺少 dictimport_ctl.py"; exit 1; }
          fi
          echo "PASS: Linux 安装包包含设置窗三个模块"
  # ── 5. macOS 构建 + 等价性 + 双端视觉一致性（本机跑要 2-3 分钟）─────
  # 此前这些只在打 tag 的 release.yml 里跑，PR/日常提交无从验证——改动一旦
  # 破坏 macOS 壳或两端视觉一致性，要到发版才发现。现在 PR 也跑。
  macos-build:
    name: macOS 构建与一致性
    runs-on: macos-latest
    needs: lint
    # job 级 concurrency 覆盖顶层的 cancel-in-progress: true。
    # macOS runner 排队常达 10 分钟，而提交间隔往往更短——若沿用顶层配置，
    # 第二次 push 会把正在排队的这次标成 cancelled，日常提交的 macOS 验证
    # 就永远跑不完（2026-10-26 实测）。这里允许排队、不取消。
    concurrency:
      group: ci-macos-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 直接跑 `make package-macos`（与 release 同一条打包链）：构建 universal
      # app + 全部随包工具 universal 自检 + zip（有 hdiutil 时再出 dmg）。
      # 此前日常 CI 只跑 build.sh，打包脚本/资源清单坏了要到打 tag 才发现
      #（与 Linux 安装包自检同一类问题，2026-10-31 补齐）。
      - name: macOS 构建 + 安装包（zip/dmg，含 universal 自检）
        run: |
          # equivalence.sh 的 B 段走 import-dict.sh，它用 bin/chaoset-import；
          # make package-macos 只构建 app 内副本，所以先 make build 产出 bin/。
          make build
          chmod +x shims/macos/build.sh shims/macos/tests/equivalence.sh \
                   shims/macos/tests/visual-parity.sh
          make package-macos
          test -f dist/chaoset-macos.zip || { echo "缺少 dist/chaoset-macos.zip"; exit 1; }
          unzip -l dist/chaoset-macos.zip | grep -q 'ChaosetIME.app/Contents/MacOS/ChaosetIME' \
            || { echo "zip 缺少主壳"; exit 1; }
          unzip -l dist/chaoset-macos.zip | grep -q 'ChaosetSetup.app/Contents/Resources/chaoset-import' \
            || { echo "zip 缺少 Setup 随包 chaoset-import"; exit 1; }
          if [ -f dist/Chaoset.dmg ]; then echo "DMG 已生成"; else echo "（无 hdiutil，跳过 DMG）"; fi

      # 顺带断言所有随包工具都是 universal：chaoset-import 曾因裸 go build 只出
      # arm64，Intel 用户点「导入词库」直接 Bad CPU type（2026-10-26 修复）。
      - name: 随包工具 universal 自检
        run: |
          for b in shims/macos/build/chaosetd shims/macos/build/tis \
                   shims/macos/build/smoke shims/macos/build/chaoset-import; do
            lipo -info "$b" | grep -q 'x86_64 arm64\|arm64 x86_64' \
              || { echo "非 universal: $b"; lipo -info "$b"; exit 1; }
          done
          echo "随包工具全部 universal"

      # 按键路由回归（审计 G7：tests/key_routing 此前未接入 CI，是「死测试」）。
      # 脚本自己编译测试二进制 + 起临时 daemon + 跑 8 项断言 + 清理。
      - name: 按键路由回归（key_routing，合成 NSEvent + 临时 daemon）
        run: |
          chmod +x shims/macos/tests/key_routing/run.sh
          ./shims/macos/tests/key_routing/run.sh

      - name: 等价性 + 双端视觉一致性
        run: |
          ./shims/macos/tests/equivalence.sh
          ./shims/macos/tests/visual-parity.sh

  # ── 6. Windows 壳：交叉编译 + 核心行为测试 + 安装包（2026-10-31 新增）──
  # 为什么需要：Windows 壳（C++/NSIS）此前只在打 tag 的 release.yml 里编译，
  # 日常提交改坏 win32.cpp 或 chaoset.nsi 时 CI 仍全绿，到发版才暴露
  #（2026-10-31 审计 A6）。这里每次 push/PR 跑与 release 相同的构建链：
  # mingw 交叉编译 DLL + core_test 对真实 daemon 跑核心行为 + makensis 编译
  # 安装脚本 + ZIP 内容自检。
  windows-build:
    name: Windows 构建（mingw + core_test + 安装包）
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 安装 mingw-w64 / NSIS / zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64 g++-mingw-w64 gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            nsis zip

      - name: Windows 壳构建（DLL 交叉编译 + 核心行为测试）
        run: |
          make build
          chmod +x shims/windows/build.sh
          ./shims/windows/build.sh

      - name: Windows 安装包（NSIS 脚本 + ZIP 内容自检）
        run: make package-windows
