name: CI

# 设计原则：把验证拆到多个并行 runner，本地只跑「改动的直接相关项」。
#
# 用户诉求（2026-10-26）：测试尽量交给 GitHub Actions，本地不跑重活，避免
# 跑测试时拖慢正常用电脑。因此 CI 覆盖了所有耗时的端到端验证：
#   - Go 单测 + race（race 本机要跑 45s+，是最重的一项）
#   - Linux 容器内 ibus 端到端（需要 docker + dbus，本机跑占资源）
#   - Windows 壳交叉编译 + 核心层行为测试 + NSIS 安装包（windows-build job；
#     2026-10-31 从「只在 release.yml 打 tag 时编译」提到日常 CI）
#   - macOS 构建 + 等价性 + 双端视觉一致性（见 release.yml 的 package-macos）
#
# 各 job 相互独立并行，单次提交约 3-5 分钟出全部结论。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧的仍在跑的流水。
#
# 但**必须按 job 分开配**：2026-10-26 实测踩坑——顶层无条件
# `cancel-in-progress: true` 时，连续两次 push 会把上一次的 macos-build 标成
# `cancelled` 并给出注解「Canceling since a higher priority waiting request
# for ci-refs/heads/main exists」。macOS runner 有容量限制、排队动辄 10 分钟，
# 而普通提交间隔远小于这个时间 → **日常提交的 macOS 验证永远跑不完**，
# 等于白配。
#
# 现在：快的 job 照旧取消（省额度、反馈快），macOS job 不配 concurrency
# （让它排完、跑完；一次排队比反复取消更省时间）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 基础：格式 / 静态检查 / 构建（最快，失败就早停）────────────
  lint:
    name: 格式 / 静态检查 / 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # workflow 结构校验已并入 make vet（Makefile 的 lint-workflows），不再单独跑
      # 一遍（2026-11-08 审计：此前同一检查在 lint job 内执行两次）。
      - name: gofmt 检查（不应有输出）
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: 静态检查（go vet + workflow + 版本单一真源）
        run: make vet

      - name: 核心构建检查
        run: make build

      - name: 安装 Slint 构建依赖 (fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Slint 设置中心静态检查 (cargo check)
        run: cargo check --manifest-path shims/settings/Cargo.toml

  # ── 2. Go + Slint 单元测试 ───────────────────────────────────────
  test:
    name: 单元测试
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 运行 Go 核心与工具单测
        run: go test ./...

      - name: 安装 Slint 构建依赖 (fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: 运行 Slint 设置中心单元测试（无头 UI + 设计令牌 + 桥接逻辑）
        run: cargo test --manifest-path shims/settings/Cargo.toml

      - name: 运行 Rust 核心引擎与守护进程单元测试
        run: cargo test --manifest-path crates/Cargo.toml

      # 核心层行为测试：用真实 chaosetd 的 Unix socket 测试台驱动 core.cpp 的
      # 协议与会话逻辑。测试在 Linux CI 常跑，毫秒级快速发现协议漂移。
      - name: 核心层行为测试（真实 daemon + Unix socket）
        run: |
          set -e
          g++ -std=c++17 -O2 -Wall -Wextra -Ishims/windows/src -Ishims/common/ipc \
              shims/windows/tests/core_test.cpp shims/common/ipc/core.cpp \
              -o /tmp/core_test
          make build
          SOCKDIR=$(mktemp -d /tmp/chaoset.XXXXXX)
          SOCK="$SOCKDIR/core.sock"
          ./bin/chaosetd -socket "$SOCK" \
              -dict data/dict_common.tsv -userdict "" > /tmp/win-daemon.log 2>&1 &
          DPID=$!
          trap 'kill -TERM $DPID 2>/dev/null || true; rm -rf "$SOCKDIR"' EXIT
          for i in $(seq 1 50); do
            if [ -S "$SOCK" ]; then break; fi
            sleep 0.2
          done
          /tmp/core_test "$SOCK"

  # ── 3. 数据竞争检测（本机最重的一项，完全交给 CI）─────────────────
  race:
    name: 数据竞争检测
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: race detector
        run: make race

  # ── 4. Linux 容器内 ibus 端到端（本机跑会占大量资源）──────────────
  linux-e2e:
    name: Linux 容器 E2E（ibus）
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      # 这套 DBus 端到端此前**只在人工容器里跑过**，CI 从未执行
      # （2026-10-26 审查指出）。现在放进 CI。
      #
      # 用 test-ci.sh（原生版）而不是 test.sh：test.sh 假设本地已用
      # setup-container.sh 起了 docker 容器并通过 docker exec 操作，而
      # GitHub runner 本身就是一次性 VM，再套 docker 要多花 1-3 分钟拉镜像。
      - name: 安装 ibus 与 dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ibus dbus dbus-x11 gir1.2-ibus-1.0 libibus-1.0-dev \
            build-essential file xvfb libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxkbcommon-x11-0

      - name: ibus 引擎端到端（组词/上屏/多实例隔离/中英切换/翻页）
        run: |
          chmod +x shims/linux/test-ci.sh
          ./shims/linux/test-ci.sh

      # 设置窗只保留 Slint 统一设置中心：Linux 的 chaoset-setup 是纯 POSIX 启动器
      # （不依赖 GTK），这里断言它能编译、能把 chaoset-settings 替换进进程，
      # 并在找不到设置中心时明确报错退出（不得回退旧原生窗口）。
      - name: 设置入口启动器编译与冒烟（chaoset-setup → chaoset-settings）
        run: |
          sh shims/linux/setup/build.sh /tmp/chaoset-setup
          file /tmp/chaoset-setup | grep -q ELF
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\necho SETTINGS_CENTER_OK\n' > /tmp/fakebin/chaoset-settings
          chmod +x /tmp/fakebin/chaoset-settings
          PATH=/tmp/fakebin:$PATH /tmp/chaoset-setup | grep -q SETTINGS_CENTER_OK
          set +e
          OUT=$(PATH=/usr/bin:/bin /tmp/chaoset-setup 2>&1)
          CODE=$?
          set -e
          echo "$OUT" | grep -q "未找到统一设置中心"
          [ "$CODE" -ne 0 ]
      - name: 编译 Slint Linux 设置中心
        run: make build-settings

      # 打包回归：release.yml 的安装包冒烟只在打 tag 时跑，日常改动可能悄悄
      # 漏装原生设置窗。这里在 PR/日常提交上构建 tar.gz（以及可用的 deb）
      # 并断言设置窗二进制在包里。
      - name: Linux 安装包自检（设置入口与 Slint 设置中心必须随包）
        run: |
          make package-linux
          tar -tzf dist/chaoset-linux-x86_64.tar.gz > /tmp/pkg-list.txt
          for f in setup/chaoset-setup bin/chaosetctl bin/chaoset-settings data/dict.tsv data/dict.bin chaoset-settings.desktop; do
            grep -q "$f" /tmp/pkg-list.txt || { echo "tar.gz 缺少 $f"; exit 1; }
          done
          # Slint 设置中心的运行时动态库必须齐全（缺库时用户点设置直接打不开）。
          # package-linux 结束后会清掉解包目录，从 tar.gz 里取设置中心做冒烟。
          rm -rf /tmp/pkg-smoke && mkdir -p /tmp/pkg-smoke
          tar -xzf dist/chaoset-linux-x86_64.tar.gz -C /tmp/pkg-smoke
          SMOKE_BIN=/tmp/pkg-smoke/chaoset-linux-x86_64/bin/chaoset-settings
          if ldd "$SMOKE_BIN" | grep -q 'not found'; then
            echo "chaoset-settings 运行时缺库："; ldd "$SMOKE_BIN"; exit 1
          fi
          set +e
          xvfb-run -a timeout 3 "$SMOKE_BIN" > /tmp/settings-smoke.log 2>&1
          SMOKE=$?
          set -e
          if [ "$SMOKE" -ne 0 ] && [ "$SMOKE" -ne 124 ]; then
            echo "Slint 设置中心无头启动失败（exit=$SMOKE）："; cat /tmp/settings-smoke.log; exit 1
          fi
          echo "PASS: Slint 设置中心无头启动 OK（exit=$SMOKE）"

          if command -v dpkg-deb >/dev/null 2>&1 && [ -f dist/chaoset_amd64.deb ]; then
            dpkg-deb -c dist/chaoset_amd64.deb | grep -q 'usr/share/chaoset/chaoset-setup' \
              || { echo "deb 缺少设置入口脚本"; exit 1; }
          fi
          echo "PASS: Linux 安装包包含设置入口与 Slint 设置中心"
  # ── 5. macOS 构建 + 等价性 + 双端视觉一致性（本机跑要 2-3 分钟）─────
  # 此前这些只在打 tag 的 release.yml 里跑，PR/日常提交无从验证——改动一旦
  # 破坏 macOS 壳或两端视觉一致性，要到发版才发现。现在 PR 也跑。
  macos-build:
    name: macOS 构建与一致性
    runs-on: macos-latest
    needs: lint
    # job 级 concurrency 覆盖顶层的 cancel-in-progress: true。
    # macOS runner 排队常达 10 分钟，而提交间隔往往更短——若沿用顶层配置，
    # 第二次 push 会把正在排队的这次标成 cancelled，日常提交的 macOS 验证
    # 就永远跑不完（2026-10-26 实测）。这里允许排队、不取消。
    concurrency:
      group: ci-macos-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # 直接跑 `make package-macos`（与 release 同一条打包链）：构建 universal
      # app + 全部随包工具 universal 自检 + zip。
      # 此前日常 CI 只跑 build.sh，打包脚本/资源清单坏了要到打 tag 才发现
      #（与 Linux 安装包自检同一类问题，2026-10-31 补齐）。
      - name: 编译 Slint macOS 设置中心（universal）
        run: make build-settings-universal

      - name: macOS 构建 + 安装包（zip，含 universal 自检）
        run: |
          # equivalence.sh 的 B 段走 import-dict.sh，它用 bin/chaoset-import；
          # make package-macos 只构建 app 内副本，所以先 make build 产出 bin/。
          make build
          chmod +x shims/macos/build.sh shims/macos/tests/equivalence.sh \
                   shims/macos/tests/visual-parity.sh
          make package-macos
          for f in chaosetd chaoset-import dict_common.tsv; do
            test -e "shims/macos/build/ChaosetIME.app/Contents/Resources/$f" \
              || { echo "输入法 app 缺少 $f"; exit 1; }
          done
          codesign --verify --deep --strict shims/macos/build/ChaosetIME.app
          test -f dist/chaoset-macos.zip || { echo "缺少 dist/chaoset-macos.zip"; exit 1; }
          unzip -l dist/chaoset-macos.zip | grep -q 'ChaosetIME.app/Contents/MacOS/ChaosetIME' \
            || { echo "zip 缺少主壳"; exit 1; }
          unzip -l dist/chaoset-macos.zip | grep -q 'ChaosetIME.app/Contents/Resources/chaosetd' \
            || { echo "zip 缺少 app 内置 daemon"; exit 1; }
          unzip -l dist/chaoset-macos.zip | grep -q 'ChaosetIME.app/Contents/Resources/chaoset-import' \
            || { echo "zip 缺少 app 内置 chaoset-import"; exit 1; }
          unzip -l dist/chaoset-macos.zip | grep -q 'ChaosetSetup.app/Contents/Resources/ChaosetIME.embedded/Contents/Resources/dict_common.tsv' \
            || { echo "zip 缺少安装器内 embedded 种子词库"; exit 1; }

      # 顺带断言所有随包工具都是 universal：chaoset-import 曾因裸 go build 只出
      # arm64，Intel 用户点「导入词库」直接 Bad CPU type（2026-10-26 修复）。
      - name: 随包工具 universal 自检
        run: |
          for b in shims/macos/build/chaosetd shims/macos/build/tis \
                   shims/macos/build/smoke shims/macos/build/chaoset-import \
                   shims/macos/build/chaosetctl \
                   shims/macos/build/ChaosetIME.app/Contents/Resources/chaosetd \
                   shims/macos/build/ChaosetIME.app/Contents/Resources/chaoset-import \
                   shims/macos/build/ChaosetIME.app/Contents/Resources/chaosetctl; do
            lipo -info "$b" | grep -q 'x86_64 arm64\|arm64 x86_64' \
              || { echo "非 universal: $b"; lipo -info "$b"; exit 1; }
          done
          echo "随包工具全部 universal"

      # 按键路由回归（审计 G7：tests/key_routing 此前未接入 CI，是「死测试」）。
      # 脚本自己编译测试二进制 + 起临时 daemon + 跑 8 项断言 + 清理。
      - name: 按键路由回归（key_routing，合成 NSEvent + 临时 daemon）
        run: |
          chmod +x shims/macos/tests/key_routing/run.sh
          ./shims/macos/tests/key_routing/run.sh

      - name: 联想端到端回归（EngineClient + 临时 daemon）
        run: |
          chmod +x shims/macos/tests/associate/run.sh
          ./shims/macos/tests/associate/run.sh

      - name: 等价性 + 双端视觉一致性
        run: |
          ./shims/macos/tests/equivalence.sh
          ./shims/macos/tests/visual-parity.sh

      # macOS 设置存储（UserDefaults 经 /usr/bin/defaults）的解析/写入单测：
      # 注入执行器，不碰真实用户偏好；此前该 store 从未被任何测试执行过。
      - name: 设置存储单测（macOS defaults）
        run: cargo test --manifest-path crates/Cargo.toml -p chaoset-config -- --nocapture

  # ── 6. Windows 壳：原生 MSVC 编译 + 安装包（windows-latest）─────────
  windows-build:
    name: Windows 构建（MSVC + 安装包）
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 配置 MSVC (x64) 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Make 与 NSIS 打包工具
        run: |
          choco install make nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          echo "C:\Program Files\NSIS" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Windows 设置中心编译 (chaoset-settings.exe)
        run: make build-settings-windows

      - name: Windows 壳编译与打包（MSVC + NSIS）
        shell: bash
        run: |
          chmod +x shims/windows/package_msvc.sh
          ./shims/windows/package_msvc.sh

  # ── 7. Windows 设置存储单测（Rust chaoset-config）──────────────────
  # crates/chaoset-config 的 WindowsStore 是设置项持久化实现，注册表 store
  # （DWORD/REG_SZ 读写、类型损坏回退）必须在真实 Windows 上执行——
  # 这里用一次性 windows runner 真跑 HKCU 往返测试（测试用独立 scratch 子键，
  # 不碰真实 Software\\Chaoset，结束后删除并断言幂等）。
  settings-windows:
    name: Windows 设置存储单测（注册表往返）
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 注册表 store 往返测试
        run: cargo test --manifest-path crates/Cargo.toml -p chaoset-config --test windows_store -- --nocapture
