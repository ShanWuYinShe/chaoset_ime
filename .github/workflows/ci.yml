name: CI

# 设计原则：把验证拆到多个并行 runner，本地只跑「改动的直接相关项」。
#
# 用户诉求（2026-10-26）：测试尽量交给 GitHub Actions，本地不跑重活，避免
# 跑测试时拖慢正常用电脑。因此 CI 覆盖了所有耗时的端到端验证：
#   - Go 单测 + race（race 本机要跑 45s+，是最重的一项）
#   - Linux 容器内 ibus 端到端（需要 docker + dbus，本机跑占资源）
#   - Windows 核心层行为测试（见 release.yml 的 package-windows job）
#   - macOS 构建 + 等价性 + 双端视觉一致性（见 release.yml 的 package-macos）
#
# 各 job 相互独立并行，单次提交约 3-5 分钟出全部结论。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧的仍在跑的流水。
#
# 但**必须按 job 分开配**：2026-10-26 实测踩坑——顶层无条件
# `cancel-in-progress: true` 时，连续两次 push 会把上一次的 macos-build 标成
# `cancelled` 并给出注解「Canceling since a higher priority waiting request
# for ci-refs/heads/main exists」。macOS runner 有容量限制、排队动辄 10 分钟，
# 而普通提交间隔远小于这个时间 → **日常提交的 macOS 验证永远跑不完**，
# 等于白配。
#
# 现在：快的 job 照旧取消（省额度、反馈快），macOS job 不配 concurrency
# （让它排完、跑完；一次排队比反复取消更省时间）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 基础：格式 / 静态检查 / 构建（最快，失败就早停）────────────
  lint:
    name: 格式 / 静态检查 / 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # workflow 结构校验：2026-10-25 有过一次文本替换误删 job 声明，导致
      # YAML 仍合法但 GitHub 判 workflow file issue、CI 全线不跑的教训。
      - name: 校验 workflow 结构
        run: |
          go run ./tools/checkworkflows \
            --expect-jobs lint,test,race,linux-e2e,macos-build \
            .github/workflows/ci.yml
          go run ./tools/checkworkflows \
            --expect-jobs test,package-macos,package-linux,package-windows,release \
            .github/workflows/release.yml

      - name: gofmt 检查（不应有输出）
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: 静态检查（go vet + workflow + 版本单一真源）
        run: make vet

      - name: 核心构建检查
        run: make build

      # 度量工具带 //go:build ignore，不在 ./... 里，单独编译防止烂掉。
      - name: 检查度量工具可编译
        run: go build -o /dev/null tools/render_metrics.go

  # ── 2. Go 单测 ────────────────────────────────────────────────────
  test:
    name: 单元测试
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 注：renderer 包已于 2026-10-27 删除，不再需要 CJK 字体做候选窗 PNG 渲染断言
      #（2026-10-30 审计清理）。如后续新增需要字体的测试，再在此安装。
      - name: 运行单元测试
        run: make test

  # ── 3. 数据竞争检测（本机最重的一项，完全交给 CI）─────────────────
  race:
    name: 数据竞争检测
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: race detector
        run: make race

  # ── 4. Linux 容器内 ibus 端到端（本机跑会占大量资源）──────────────
  linux-e2e:
    name: Linux 容器 E2E（ibus）
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 这套 DBus 端到端此前**只在人工容器里跑过**，CI 从未执行
      # （2026-10-26 审查指出）。现在放进 CI。
      #
      # 用 test-ci.sh（原生版）而不是 test.sh：test.sh 假设本地已用
      # setup-container.sh 起了 docker 容器并通过 docker exec 操作，而
      # GitHub runner 本身就是一次性 VM，再套 docker 要多花 1-3 分钟拉镜像。
      - name: 安装 ibus 与 dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ibus dbus dbus-x11 gir1.2-ibus-1.0 python3-gi

      - name: ibus 引擎端到端（组词/上屏/多实例隔离/中英切换/翻页）
        run: |
          chmod +x shims/linux/test-ci.sh
          ./shims/linux/test-ci.sh
  # ── 5. macOS 构建 + 等价性 + 双端视觉一致性（本机跑要 2-3 分钟）─────
  # 此前这些只在打 tag 的 release.yml 里跑，PR/日常提交无从验证——改动一旦
  # 破坏 macOS 壳或两端视觉一致性，要到发版才发现。现在 PR 也跑。
  macos-build:
    name: macOS 构建与一致性
    runs-on: macos-latest
    needs: lint
    # job 级 concurrency 覆盖顶层的 cancel-in-progress: true。
    # macOS runner 排队常达 10 分钟，而提交间隔往往更短——若沿用顶层配置，
    # 第二次 push 会把正在排队的这次标成 cancelled，日常提交的 macOS 验证
    # 就永远跑不完（2026-10-26 实测）。这里允许排队、不取消。
    concurrency:
      group: ci-macos-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 构建 macOS app（含 universal 架构自检）
        run: |
          make build
          chmod +x shims/macos/build.sh shims/macos/tests/equivalence.sh \
                   shims/macos/tests/visual-parity.sh
          ./shims/macos/build.sh
          for app in shims/macos/build/ChaosetIME.app shims/macos/build/ChaosetSetup.app; do
            bin="$app/Contents/MacOS/$(basename "$app" .app)"
            lipo -info "$bin"
            lipo -info "$bin" | grep -q x86_64 || { echo "缺少 x86_64: $bin"; exit 1; }
            lipo -info "$bin" | grep -q arm64  || { echo "缺少 arm64: $bin"; exit 1; }
          done

      # 顺带断言所有随包工具都是 universal：chaoset-import 曾因裸 go build 只出
      # arm64，Intel 用户点「导入词库」直接 Bad CPU type（2026-10-26 修复）。
      - name: 随包工具 universal 自检
        run: |
          for b in shims/macos/build/chaosetd shims/macos/build/tis \
                   shims/macos/build/smoke shims/macos/build/chaoset-import; do
            lipo -info "$b" | grep -q 'x86_64 arm64\|arm64 x86_64' \
              || { echo "非 universal: $b"; lipo -info "$b"; exit 1; }
          done
          echo "随包工具全部 universal"

      - name: 等价性 + 双端视觉一致性
        run: |
          ./shims/macos/tests/equivalence.sh
          ./shims/macos/tests/visual-parity.sh
