name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 格式 / 静态检查 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt 检查（不应有输出）
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet 静态分析
        run: go vet ./...

      - name: 测试（含 -race）
        run: go test -race -count=1 ./...

      - name: 构建
        run: make build
