[package]
name = "chaoset-settings"
version = "0.3.35"
edition = "2021"
authors = ["liyou <winliyou@outlook.com>"]
description = "Chaoset 拼音输入法跨平台设置中心"

[lib]
path = "src/lib.rs"

[[bin]]
name = "chaoset-settings"
path = "src/main.rs"

[dependencies]
slint = { version = "1.9", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"

[dev-dependencies]
i-slint-backend-testing = "1.9"

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
