<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0062CC"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed Keycap: 满幅撑满 0 到 sz，无多余外框缩进 -->
  <rect x="0" y="0" width="256" height="256" rx="30.7" ry="30.7" fill="url(#blueGrad)"/>
  <!-- Specular Rim Line -->
  <line x1="31.7" y1="1" x2="224.3" y2="1" stroke="#90C5FF" stroke-width="10.2" stroke-opacity="0.8" stroke-linecap="round"/>
  <!-- Ultra Bold Centered C: 真正撑满方块、笔画粗重、在视觉重量与面积上与汉字完全等同 -->
  <text x="128.00" y="207.36" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei UI', 'Liberation Sans', Arial, sans-serif" font-size="261.12" font-weight="900" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12.80" paint-order="stroke fill">C</text>
</svg>