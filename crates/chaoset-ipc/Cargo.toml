[package]
name = "chaoset-ipc"
version = "0.4.0"
edition = "2021"
description = "Chaoset IME daemon IPC 协议帧与客户端（Rust 唯一实现）"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chaoset-config = { path = "../chaoset-config" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.10"
